[project]
name = "mi-decoding"
version = "0.1.0"
description = "Left vs right fist motor-imagery decoding on PhysioNet EEGMMIDB (NT@B FA26 take-home)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mne>=1.13,<2",
    "numpy>=1.26,<3",
    "scipy>=1.13",
    "scikit-learn>=1.5,<2",
    "pyriemann>=0.7",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "joblib>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mi_decoding"]
